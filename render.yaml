services:
  - type: web
    name: denizstagram
    runtime: node
    plan: free
    buildCommand: "npm install"
    startCommand: "npm start"
    envVars:
      - key: NODE_VERSION
        value: "20"
    disk:
      name: denizstagram-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
